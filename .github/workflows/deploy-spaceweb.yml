name: Deploy to SpaceWeb

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/pages-ne-zabyvay.yml'
      - '.github/workflows/deploy-spaceweb.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload website to SpaceWeb
        env:
          FTP_HOST: ${{ secrets.SWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.SWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SWEB_FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:passive-mode true;
          set ssl:check-hostname false;
          open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
          mirror --reverse --verbose \
            --exclude-glob .git* \
            --exclude-glob .github/** \
            ./ /;
          bye
          "
