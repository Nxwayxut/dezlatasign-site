name: Deploy to SpaceWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Decode generated media assets
        run: |
          if [ -d .asset-parts ]; then
            for src in .asset-parts/*.b64; do
              [ -e "$src" ] || continue
              name="$(basename "$src" .b64)"
              base64 -d "$src" > "images/$name"
            done
          fi

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload website to SpaceWeb
        env:
          FTP_HOST: ${{ secrets.SWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.SWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SWEB_FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:passive-mode true;
          set ssl:check-hostname false;
          open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
          mirror --reverse --verbose \
            --exclude-glob .git* \
            --exclude-glob .github/** \
            --exclude-glob .asset-parts/** \
            ./ /;
          bye
          "
