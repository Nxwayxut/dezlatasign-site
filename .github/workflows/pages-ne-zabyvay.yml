name: Deploy Ne Zabyvay to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ne-zabyvay/**'
      - '.github/workflows/pages-ne-zabyvay.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ne-zabyvay-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app files
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ne-zabyvay

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
