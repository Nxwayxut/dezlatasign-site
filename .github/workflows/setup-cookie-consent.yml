name: One-time cookie consent setup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-cookie-consent.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add cookie consent and privacy policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          counter_id = '111279263'

          privacy_js = r'''(() => {
            const COUNTER_ID = 111279263;
            const STORAGE_KEY = 'zs_cookie_choice_v1';
            const DISABLE_KEY = `disableYaCounter${COUNTER_ID}`;
            let metrikaLoaded = false;

            const safeGet = () => {
              try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
            };

            const safeSet = value => {
              try { localStorage.setItem(STORAGE_KEY, value); } catch (_) {}
            };

            const loadMetrika = () => {
              if (metrikaLoaded) return;
              metrikaLoaded = true;
              window[DISABLE_KEY] = false;

              (function(m,e,t,r,i,k,a){
                m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
                m[i].l=1*new Date();
                for (let j = 0; j < document.scripts.length; j += 1) {
                  if (document.scripts[j].src === r) return;
                }
                k=e.createElement(t); a=e.getElementsByTagName(t)[0];
                k.async=1; k.src=r; a.parentNode.insertBefore(k,a);
              })(window, document, 'script', `https://mc.yandex.ru/metrika/tag.js?id=${COUNTER_ID}`, 'ym');

              ym(COUNTER_ID, 'init', {
                ssr: true,
                webvisor: true,
                clickmap: true,
                ecommerce: 'dataLayer',
                referrer: document.referrer,
                url: location.href,
                accurateTrackBounce: true,
                trackLinks: true
              });
            };

            const clearMetrikaCookies = () => {
              const names = document.cookie.split(';').map(part => part.split('=')[0].trim()).filter(Boolean);
              names.filter(name => name.startsWith('_ym_') || name === 'yandexuid' || name === 'ymex').forEach(name => {
                document.cookie = `${name}=; Max-Age=0; path=/; SameSite=Lax`;
                document.cookie = `${name}=; Max-Age=0; path=/; domain=.dezlatasign.ru; SameSite=Lax`;
              });
              try {
                Object.keys(localStorage).filter(key => key.startsWith('_ym')).forEach(key => localStorage.removeItem(key));
              } catch (_) {}
            };

            const stopMetrika = () => {
              window[DISABLE_KEY] = true;
              if (typeof window.ym === 'function') {
                try { window.ym(COUNTER_ID, 'destruct'); } catch (_) {}
              }
              clearMetrikaCookies();
              metrikaLoaded = false;
            };

            const styles = document.createElement('style');
            styles.textContent = `
              .cookie-consent {
                position: fixed;
                left: clamp(14px, 2vw, 28px);
                right: clamp(14px, 2vw, 28px);
                bottom: clamp(14px, 2vw, 28px);
                z-index: 1300;
                max-width: 900px;
                margin-left: auto;
                padding: clamp(18px, 2.2vw, 28px);
                border: 1px solid var(--ink, #0b0b0d);
                border-radius: var(--radius, 22px);
                color: var(--ink, #0b0b0d);
                background: rgba(251,250,247,.97);
                box-shadow: 0 24px 70px rgba(11,11,13,.18);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                opacity: 0;
                transform: translateY(18px);
                pointer-events: none;
                transition: opacity .25s ease, transform .25s ease;
              }
              .cookie-consent.is-visible { opacity: 1; transform: none; pointer-events: auto; }
              .cookie-consent__grid { display: grid; grid-template-columns: 1fr auto; gap: clamp(18px, 3vw, 40px); align-items: end; }
              .cookie-consent__copy { max-width: 620px; }
              .cookie-consent__eyebrow { display: inline-flex; margin-bottom: 12px; padding: 7px 10px; border-radius: 999px; color: #fff; background: var(--accent, #2c16ff); font: 700 11px/1 var(--font-body, Inter, sans-serif); letter-spacing: .08em; text-transform: uppercase; }
              .cookie-consent h2 { margin: 0 0 8px; font: 700 clamp(22px, 2.5vw, 34px)/1.02 var(--font-display, Onest, sans-serif); letter-spacing: -.035em; }
              .cookie-consent p { margin: 0; color: var(--muted, #6e6c67); font: 400 clamp(13px, 1.1vw, 15px)/1.5 var(--font-body, Inter, sans-serif); }
              .cookie-consent a { text-decoration: underline; text-underline-offset: 3px; }
              .cookie-consent__actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
              .cookie-consent__button { min-height: 44px; padding: 0 16px; border: 1px solid var(--ink, #0b0b0d); border-radius: 999px; background: transparent; cursor: pointer; font: 600 12px/1 var(--font-body, Inter, sans-serif); transition: transform .18s ease, background .18s ease, color .18s ease; }
              .cookie-consent__button:hover, .cookie-consent__button:focus-visible { transform: translateY(-1px); outline: none; }
              .cookie-consent__button--accept { border-color: var(--accent, #2c16ff); color: #fff; background: var(--accent, #2c16ff); }
              .cookie-settings-link { border: 0; padding: 0; color: inherit; background: transparent; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
              .contact__footer .cookie-legal-links { display: inline-flex; gap: 14px; align-items: center; flex-wrap: wrap; }
              @media (max-width: 720px) {
                .cookie-consent { left: 10px; right: 10px; bottom: 10px; padding: 18px; border-radius: 18px; }
                .cookie-consent__grid { grid-template-columns: 1fr; align-items: stretch; }
                .cookie-consent__actions { justify-content: flex-start; }
                .cookie-consent__button { flex: 1 1 auto; }
              }
              @media (prefers-reduced-motion: reduce) { .cookie-consent { transition: none; } }
            `;
            document.head.appendChild(styles);

            let banner = null;

            const hideBanner = () => {
              if (!banner) return;
              banner.classList.remove('is-visible');
              window.setTimeout(() => { banner?.remove(); banner = null; }, 260);
            };

            const showBanner = () => {
              if (banner) { banner.classList.add('is-visible'); return; }
              banner = document.createElement('section');
              banner.className = 'cookie-consent';
              banner.setAttribute('role', 'dialog');
              banner.setAttribute('aria-label', 'Настройки cookie');
              banner.innerHTML = `
                <div class="cookie-consent__grid">
                  <div class="cookie-consent__copy">
                    <span class="cookie-consent__eyebrow">cookie, но без крошек</span>
                    <h2>Тут водятся куки.</h2>
                    <p>Они помогают Яндекс Метрике понять, что на сайте смотрят чаще. Аналитика включится только с твоего согласия. <a href="/privacy/">Что именно собирается</a>.</p>
                  </div>
                  <div class="cookie-consent__actions">
                    <button class="cookie-consent__button" type="button" data-cookie-decline>Без статистики</button>
                    <button class="cookie-consent__button cookie-consent__button--accept" type="button" data-cookie-accept>Окей, считаем</button>
                  </div>
                </div>`;
              document.body.appendChild(banner);

              banner.querySelector('[data-cookie-accept]')?.addEventListener('click', () => {
                safeSet('accepted');
                loadMetrika();
                hideBanner();
              });

              banner.querySelector('[data-cookie-decline]')?.addEventListener('click', () => {
                safeSet('declined');
                stopMetrika();
                hideBanner();
              });

              requestAnimationFrame(() => banner?.classList.add('is-visible'));
            };

            const addFooterLinks = () => {
              document.querySelectorAll('.contact__footer').forEach(footer => {
                if (footer.querySelector('.cookie-legal-links')) return;
                const group = document.createElement('span');
                group.className = 'cookie-legal-links';
                group.innerHTML = '<a href="/privacy/">Политика данных</a><button class="cookie-settings-link" type="button" data-cookie-settings>Настройки cookie</button>';
                const topLink = [...footer.querySelectorAll('a')].find(link => link.getAttribute('href') === '#top');
                if (topLink) footer.insertBefore(group, topLink);
                else footer.appendChild(group);
              });
            };

            document.addEventListener('click', event => {
              const trigger = event.target.closest('[data-cookie-settings]');
              if (!trigger) return;
              event.preventDefault();
              showBanner();
            });

            window[DISABLE_KEY] = true;
            const choice = safeGet();
            if (choice === 'accepted') loadMetrika();
            else if (choice !== 'declined') showBanner();

            addFooterLinks();
          })();
          '''

          privacy_html = r'''<!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#f3f0e9">
            <meta name="robots" content="index,follow">
            <meta name="description" content="Политика обработки персональных данных и использования cookie на сайте dezlatasign.ru.">
            <link rel="canonical" href="https://dezlatasign.ru/privacy/">
            <title>Политика данных — Злата Сухарькова</title>
            <link rel="icon" href="/favicon-zdot.svg?v=22" type="image/svg+xml">
            <link rel="shortcut icon" href="/favicon-zdot.png?v=22" type="image/png">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="/css/style.css?v=30">
            <script src="/js/privacy.js?v=1" defer></script>
            <style>
              .privacy-shell { max-width: var(--max); margin: 0 auto; padding: 118px var(--pad) 72px; }
              .privacy-hero { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(260px,.6fr); gap: clamp(30px,7vw,110px); align-items: end; padding-bottom: clamp(44px,7vw,90px); border-bottom: 1px solid var(--ink); }
              .privacy-kicker { display:flex; justify-content:space-between; gap:20px; margin-bottom:18px; font-size:var(--small-size); font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
              .privacy-hero h1 { margin:0; font-family:var(--font-display); font-size:clamp(58px,8vw,124px); line-height:.88; letter-spacing:-.065em; font-weight:800; }
              .privacy-hero p { margin:0; color:var(--muted); font-size:clamp(14px,1.1vw,17px); line-height:1.55; }
              .privacy-list { display:grid; }
              .privacy-row { display:grid; grid-template-columns:72px minmax(0,.8fr) minmax(0,1.4fr); gap:clamp(18px,4vw,64px); padding:clamp(28px,4vw,54px) 0; border-bottom:1px solid var(--line); }
              .privacy-row__n { color:var(--accent); font:700 12px/1 var(--font-body); letter-spacing:.1em; }
              .privacy-row h2 { margin:0; font-family:var(--font-display); font-size:clamp(25px,3vw,42px); line-height:1.04; letter-spacing:-.04em; }
              .privacy-row__body { color:var(--muted); font-size:var(--body-size); line-height:1.65; }
              .privacy-row__body p { margin:0 0 14px; }
              .privacy-row__body p:last-child { margin-bottom:0; }
              .privacy-row__body ul { margin:0; padding-left:1.2em; }
              .privacy-row__body a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
              .privacy-actions { display:flex; gap:10px; flex-wrap:wrap; padding-top:36px; }
              .privacy-action { display:inline-flex; align-items:center; min-height:46px; padding:0 18px; border:1px solid var(--ink); border-radius:999px; background:transparent; cursor:pointer; font:600 12px/1 var(--font-body); }
              .privacy-action--accent { color:#fff; border-color:var(--accent); background:var(--accent); }
              @media (max-width:780px){ .privacy-hero{grid-template-columns:1fr}.privacy-row{grid-template-columns:42px 1fr}.privacy-row__body{grid-column:2}.privacy-shell{padding-top:100px}.privacy-hero h1{font-size:clamp(52px,16vw,86px)} }
            </style>
          </head>
          <body>
            <header class="site-header" data-header>
              <a class="brand" href="/" aria-label="Вернуться на главную">
                <span class="brand__mark">Z<span class="mark-dot">.</span></span>
                <span class="brand__text">Злата Сухарькова</span>
              </a>
              <nav class="main-nav" aria-label="Навигация"><a href="/">Вернуться на сайт</a></nav>
            </header>

            <main class="privacy-shell">
              <div class="privacy-kicker"><span>Документы</span><span>Обновлено 21.08.2026</span></div>
              <section class="privacy-hero">
                <h1>Политика<br>данных</h1>
                <p>Без юридического тумана: здесь описано, какие данные может обрабатывать сайт dezlatasign.ru, зачем они нужны и как изменить свой выбор по cookie.</p>
              </section>

              <div class="privacy-list">
                <section class="privacy-row"><span class="privacy-row__n">01</span><h2>Кто обрабатывает данные</h2><div class="privacy-row__body"><p>Оператор сайта — Злата Сухарькова. Сайт: <a href="https://dezlatasign.ru/">dezlatasign.ru</a>. Для вопросов о персональных данных: <a href="mailto:zlatasuharkova@yandex.ru">zlatasuharkova@yandex.ru</a>.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">02</span><h2>Что может собираться</h2><div class="privacy-row__body"><p>Сам сайт не содержит форм регистрации, личного кабинета или оплаты. При согласии на аналитику Яндекс Метрика может получать технические и статистические данные:</p><ul><li>cookie и идентификаторы браузера;</li><li>IP-адрес и приблизительный регион;</li><li>тип устройства, браузер и операционную систему;</li><li>адрес открытой страницы, источник перехода и действия на сайте;</li><li>данные, необходимые для Вебвизора, карты кликов и статистики посещений.</li></ul><p>Отдельно в localStorage сохраняется только выбор пользователя по cookie — «разрешено» или «отклонено», чтобы не показывать плашку при каждом открытии сайта.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">03</span><h2>Зачем</h2><div class="privacy-row__body"><p>Данные аналитики используются, чтобы понимать посещаемость сайта, находить технические проблемы и видеть, какие проекты и разделы интересны посетителям. Они не используются на сайте для автоматического принятия решений о человеке.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">04</span><h2>Основание обработки</h2><div class="privacy-row__body"><p>Аналитическая Яндекс Метрика загружается только после явного согласия через кнопку на cookie-плашке. До согласия или после отказа счетчик не запускается.</p><p>Если посетитель самостоятельно пишет на email, звонит или переходит во ВКонтакте, дальнейшая обработка переданных им контактных данных происходит для ответа на обращение и обсуждения проекта.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">05</span><h2>Яндекс Метрика и cookie</h2><div class="privacy-row__body"><p>Для аналитики используется сервис Яндекс Метрика, счетчик № 111279263. Метрика применяет собственные cookie и localStorage для учета посещений. Сведения о конкретных cookie и сроках их хранения публикует Яндекс: <a href="https://yandex.ru/support/metrica/ru/general/cookie-usage" target="_blank" rel="noopener noreferrer">справка по cookie Метрики</a>.</p><p>Условия обработки данных в Метрике: <a href="https://yandex.ru/legal/metrica_termsofuse/ru/" target="_blank" rel="noopener noreferrer">условия сервиса</a>.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">06</span><h2>Как отказаться или изменить выбор</h2><div class="privacy-row__body"><p>Можно сразу выбрать «Без статистики» на cookie-плашке. Уже сделанный выбор можно изменить кнопкой ниже или через ссылку «Настройки cookie» внизу сайта.</p><p>При отзыве согласия сайт останавливает Метрику и удаляет доступные ему cookie Метрики на своем домене. Также можно очистить cookie и localStorage в настройках браузера.</p><div class="privacy-actions"><button class="privacy-action privacy-action--accent" type="button" data-cookie-settings>Изменить настройки cookie</button><a class="privacy-action" href="/">Вернуться на сайт</a></div></div></section>

                <section class="privacy-row"><span class="privacy-row__n">07</span><h2>Права пользователя</h2><div class="privacy-row__body"><p>Пользователь может запросить сведения об обработке своих персональных данных, потребовать их уточнения или удаления в предусмотренных законом случаях и отозвать ранее данное согласие. Запрос можно направить на <a href="mailto:zlatasuharkova@yandex.ru">zlatasuharkova@yandex.ru</a>.</p></div></section>

                <section class="privacy-row"><span class="privacy-row__n">08</span><h2>Изменения политики</h2><div class="privacy-row__body"><p>Политика может обновляться, если меняется функциональность сайта, состав подключенных сервисов или требования законодательства. Актуальная версия всегда размещается по адресу <a href="https://dezlatasign.ru/privacy/">dezlatasign.ru/privacy/</a>.</p></div></section>
              </div>
            </main>
          </body>
          </html>
          '''

          Path('js/privacy.js').write_text(privacy_js, encoding='utf-8')
          Path('privacy').mkdir(exist_ok=True)
          Path('privacy/index.html').write_text(privacy_html, encoding='utf-8')

          metrika_block = re.compile(r'\s*<!-- Yandex\.Metrika counter -->.*?<!-- /Yandex\.Metrika counter -->\s*', re.S)
          metrika_noscript = re.compile(r'\s*<noscript>\s*<div><img\s+src="https://mc\.yandex\.ru/watch/111279263".*?</noscript>\s*', re.S)

          def patch_html(path, privacy_src):
            text = path.read_text(encoding='utf-8')
            text = metrika_block.sub('\n', text)
            text = metrika_noscript.sub('\n', text)
            if 'privacy.js' not in text:
              script_re = re.compile(r'(<script\s+src="(?:\.\./)?js/script\.js[^\"]*"\s+defer></script>)')
              text, count = script_re.subn(f'<script src="{privacy_src}" defer></script>\n  \\1', text, count=1)
              if count == 0:
                text = text.replace('</head>', f'  <script src="{privacy_src}" defer></script>\n</head>')
            path.write_text(text, encoding='utf-8')

          patch_html(Path('index.html'), 'js/privacy.js?v=1')
          patch_html(Path('works/index.html'), '../js/privacy.js?v=1')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
            text = sitemap.read_text(encoding='utf-8')
            if 'https://dezlatasign.ru/privacy/' not in text:
              entry = '  <url>\n    <loc>https://dezlatasign.ru/privacy/</loc>\n  </url>\n'
              text = text.replace('</urlset>', entry + '</urlset>')
              sitemap.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/setup-cookie-consent.yml')
          if workflow.exists():
            workflow.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add cookie consent and privacy policy"
          git push
